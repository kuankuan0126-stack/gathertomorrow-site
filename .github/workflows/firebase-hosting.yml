# Deploys this static site with FirebaseExtended/action-hosting-deploy.
# Preview channel: pull requests from this repository.
# Live channel: push to the default branch (main).
# The service account JSON is read from the FIREBASE_SERVICE_ACCOUNT secret.
# Nothing in this file is a credential. See DEPLOY-FIREBASE.md.

name: Deploy to Firebase Hosting

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  checks: write
  contents: read
  pull-requests: write

concurrency:
  group: firebase-hosting-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy_preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read Firebase project id
        id: project
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT is not set. Skipping the preview deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node <<'NODE'
          const fs = require("fs");
          const id = JSON.parse(fs.readFileSync(".firebaserc", "utf8")).projects.default;
          if (!id || id === "YOUR_FIREBASE_PROJECT_ID") {
            console.error("Replace YOUR_FIREBASE_PROJECT_ID in .firebaserc with the real Firebase project id.");
            process.exit(1);
          }
          if (!/^[a-z0-9-]+$/.test(id)) {
            console.error("The Firebase project id in .firebaserc contains unexpected characters.");
            process.exit(1);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, "skip=false\nid=" + id + "\n");
          console.log("Firebase project: " + id);
          NODE

      - name: Deploy preview channel
        if: steps.project.outputs.skip != 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ steps.project.outputs.id }}
          expires: 7d
          force: true

  deploy_live:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read Firebase project id
        id: project
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT is not set. Skipping the live deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node <<'NODE'
          const fs = require("fs");
          const id = JSON.parse(fs.readFileSync(".firebaserc", "utf8")).projects.default;
          if (!id || id === "YOUR_FIREBASE_PROJECT_ID") {
            console.error("Replace YOUR_FIREBASE_PROJECT_ID in .firebaserc with the real Firebase project id.");
            process.exit(1);
          }
          if (!/^[a-z0-9-]+$/.test(id)) {
            console.error("The Firebase project id in .firebaserc contains unexpected characters.");
            process.exit(1);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, "skip=false\nid=" + id + "\n");
          console.log("Firebase project: " + id);
          NODE

      - name: Deploy live channel
        if: steps.project.outputs.skip != 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ steps.project.outputs.id }}
          channelId: live
          force: true
